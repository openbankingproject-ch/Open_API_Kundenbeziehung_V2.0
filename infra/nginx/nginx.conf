worker_processes auto;
events {
    worker_connections 1024;
}

http {
    upstream spring_app {
        server api:8080;
        keepalive 32;
    }

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    server {
        listen 443 ssl;
        http2 on;
        server_name api.openapi.local;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        ssl_verify_client on;
        ssl_client_certificate /etc/nginx/certs/ca-bundle.pem;
        ssl_verify_depth 2;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-SSL-CERT        $ssl_client_escaped_cert;
        proxy_set_header X-SSL-VERIFY      $ssl_client_verify;
        proxy_set_header X-SSL-S-DN        $ssl_client_s_dn;
        proxy_set_header X-SSL-I-DN        $ssl_client_i_dn;
        proxy_set_header X-SSL-FINGERPRINT $ssl_client_fingerprint;

        location / {
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }
            proxy_pass http://spring_app;
        }

        location /actuator/health {
            proxy_pass http://spring_app;
        }
    }

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
